AWSTemplateFormatVersion: '2010-09-09'
Description: Kakeibo SaaS - Static hosting (private S3 + CloudFront via OAC, SPA fallback)

Parameters:
  Stage:
    Type: String
    AllowedValues: [prod, dev]

Resources:
  # Private bucket. No public access; served only through CloudFront OAC.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kakeibo-web-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub kakeibo-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub kakeibo-web-${Stage}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        # ↓ ライブ配信(prod=app.kurofukubo.com)に合わせてドリフトを反映済み。
        #   prod の証明書ARNは us-east-1 のもの。再デプロイ前に値が現状と一致するか要確認。
        Aliases:
          - app.kurofukubo.com
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:117953360790:certificate/b7b9910a-cac5-43f4-8b93-c63c5d2a42a2
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy (HSTS / nosniff / X-Frame-Options / Referrer-Policy)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # SPA: let the client router handle unknown paths
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}

Outputs:
  BucketName:
    Description: S3 bucket to sync the built SPA into
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id (for cache invalidation)
    Value: !Ref Distribution
  DistributionDomain:
    Description: CloudFront default domain
    Value: !GetAtt Distribution.DomainName
