<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { display: grid; grid-template-columns: 1fr 1010px; align-items: center; }
  .tx { padding: 0 0 0 88px; }
  h1 { font-size: 58px; font-weight: 900; line-height: 1.32; letter-spacing: -.01em; margin-top: 22px; }
  h1 em { font-style: normal; color: var(--ac); }
  p { font-size: 19px; line-height: 1.95; color: var(--tx2); margin-top: 22px; max-width: 480px; }
  .badge { margin-top: 34px; }
  .brand { margin-top: 46px; }
  .shots { display: flex; gap: 26px; align-items: center; padding-right: 56px; }
  .shots .phone { width: 288px; }
  .shots .phone:nth-child(2) { transform: translateY(-34px); }
</style></head><body>
  <div class="tx">
    <div class="eyebrow">iPHONE APP</div>
    <h1>家計簿を、<br><em>ポケットに。</em></h1>

    <div class="badge">まもなく App Store で公開</div>
    <div class="brand"><b>黒福簿</b><span>kurofukubo.com</span></div>
  </div>
  <div class="shots">
    <div class="phone"><img src="../../appstore/screenshots/05_ledger.png" alt=""></div>
    <div class="phone"><img src="../../appstore/screenshots/01_dashboard.png" alt=""></div>
    <div class="phone"><img src="../../appstore/screenshots/02_entry.png" alt=""></div>
  </div>
</body></html>
