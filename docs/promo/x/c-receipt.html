<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { display: grid; grid-template-columns: 1fr 560px; align-items: center; background: var(--ac-tint); }
  .tx { padding: 0 40px 0 88px; }
  h1 { font-size: 50px; font-weight: 900; line-height: 1.34; margin-top: 22px; }
  h1 em { font-style: normal; color: var(--ac); }
  .btnshot { margin-top: 32px; max-width: 620px; background: #fff; border: 1px solid var(--bd); border-radius: 16px; padding: 16px 18px; box-shadow: 0 18px 40px -26px rgba(34,48,43,.5); }
  .btnshot img { display: block; width: 100%; }
  .btnshot .lbl { font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; color: var(--tx3); margin-bottom: 10px; }
  p { font-size: 19px; line-height: 1.95; color: var(--tx2); margin-top: 26px; max-width: 560px; }
  p b { color: var(--tx); font-weight: 700; }
  .brand { margin-top: 40px; }
  .shot { padding-right: 72px; }
  .shot .phone { width: 368px; margin-left: auto; }
</style></head><body>
  <div class="tx">
    <div class="eyebrow">ON-DEVICE OCR</div>
    <h1>レシートは、<br><em>端末の中だけ</em>で読みます。</h1>
    <div class="btnshot">
      <div class="lbl">記帳画面</div>
      <img src="receipt-btn.png" alt="レシート・利用控えを撮って記帳">
    </div>
    <p>ふつうは画像をサーバーへ送って読み取ります。黒福簿のiPhoneアプリは端末の中で完結するので、<b>写真も読み取り結果も外に出ません。</b></p>
    <div class="brand"><b>黒福簿</b><span>kurofukubo.com</span></div>
  </div>
  <div class="shot">
    <div class="phone"><img src="../../appstore/screenshots/02_entry.png" alt=""></div>
  </div>
</body></html>
