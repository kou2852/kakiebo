<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 50px 72px 0; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; }
  h1 { font-size: 40px; font-weight: 900; line-height: 1.3; margin-top: 14px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px; margin-top: 34px; }
  .no { font-family: var(--mono); font-size: 14px; letter-spacing: .16em; color: var(--ac); }
  h2 { font-size: 25px; font-weight: 900; margin-top: 8px; }
  .cap { font-size: 15.5px; line-height: 1.85; color: var(--tx2); margin-top: 10px; min-height: 58px; }
  .phone { width: 255px; margin: 20px auto 0; }
</style></head><body>
  <div class="head">
    <div>
      <div class="eyebrow">GET STARTED</div>
      <h1>使いはじめは、3ステップ。</h1>
    </div>
    <div class="brand"><b>黒福簿</b><span>kurofukubo.com</span></div>
  </div>
  <div class="steps">
    <div>
      <div class="no">STEP 1</div>
      <h2>記帳する</h2>
      <p class="cap">レシートを撮るか、日付・摘要・金額を入れるだけ。借方と貸方は、科目を選べば組み上がります。</p>
      <div class="phone"><img src="../../appstore/screenshots/02_entry.png" alt=""></div>
    </div>
    <div>
      <div class="no">STEP 2</div>
      <h2>帳簿になる</h2>
      <p class="cap">「何に使ったか」と「どこから払ったか」が対で残るので、口座ごとの残高が合います。</p>
      <div class="phone"><img src="../../appstore/screenshots/05_ledger.png" alt=""></div>
    </div>
    <div>
      <div class="no">STEP 3</div>
      <h2>純資産が見える</h2>
      <p class="cap">資産から負債を引いた金額が自動で出ます。増えているのか減っているのかが分かります。</p>
      <div class="phone"><img src="../../appstore/screenshots/01_dashboard.png" alt=""></div>
    </div>
  </div>
</body></html>
