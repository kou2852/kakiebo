<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<!-- 1・2枚目（2枚で1つの絵）。2640×2868 で描いて半分ずつに切る。
     他アプリの分析（2026-09-30）から: 端末を傾けて境目にまたがせる／主役の数字は端末の外に大きく引き出す／
     境目の上には文字を置かない（ストアの隙間で割れる）／1枚目に事実のバッジ。
     ⚠ 浮かせる数字は実際の画面と同じ値にする。タグ配分の値はデモ帳簿に配分を入れてから差し替える（いまは仮）。 -->
<style>
  .deco { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); }
  .big { position: absolute; top: 1020px; left: 1320px; width: 1100px; transform: translateX(-50%) rotate(-6deg);
         border-radius: 140px; padding: 30px; z-index: 2; }
  .big img { border-radius: 112px; }
  .card { position: absolute; z-index: 3; background: #fff; color: #16191c; border-radius: 56px; padding: 56px 60px;
          box-shadow: 0 60px 120px -40px rgba(0,0,0,.5); }
  .card .lb { font-size: 44px; font-weight: 700; color: #5c656d; }
  .nw { top: 1320px; left: 70px; width: 820px; transform: rotate(-3deg); }
  .nw .v { font-size: 128px; font-weight: 900; color: #0f7a6c; letter-spacing: -.02em; line-height: 1.1; margin-top: 10px; }
  .nw svg { display: block; margin-top: 26px; }
  .alloc { top: 1700px; left: 1830px; width: 740px; transform: rotate(3deg); }
  .row { display: flex; align-items: center; gap: 22px; font-size: 50px; font-weight: 700; margin-top: 34px; }
  .row i { width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .row span { flex: 1; } .row b { font-weight: 900; }
  .bar { display: flex; height: 26px; border-radius: 13px; overflow: hidden; margin-top: 30px; }
  .tag { position: absolute; z-index: 4; background: #fff; color: #16191c; border-radius: 999px; padding: 26px 50px;
         font-size: 58px; font-weight: 900; display: flex; align-items: center; gap: 20px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45); }
  .tag i { width: 34px; height: 34px; border-radius: 50%; }
  .badges { display: flex; gap: 20px; margin-top: 44px; flex-wrap: wrap; }
  .badges span { font-size: 42px; font-weight: 700; border: 3px solid rgba(255,255,255,.55); border-radius: 999px; padding: 14px 32px; }
</style></head>
<body class="pair">
<div class="deco" style="width:1300px;height:1300px;left:-420px;top:1900px"></div>
<div class="deco" style="width:900px;height:900px;left:1900px;top:-260px"></div>
<div class="panel" style="left:0">
  <div class="head"><div class="eyebrow">複式簿記の家計簿</div><h1>資産も借金も、<br><em>純資産</em>ひとつで。</h1>
    <div class="badges"><span>銀行連携なし</span><span>登録なしで試せる</span></div></div>
</div>
<div class="panel" style="left:1320px">
  <div class="head"><div class="eyebrow">タグ配分</div><h1>口座のお金を、<br><em>目的ごと</em>に。</h1></div>
</div>
<div class="phone big"><img src="../screenshots/01_dashboard.png" alt=""></div>

<!-- 端末から引き出した純資産（ダッシュボードの値そのまま） -->
<div class="card nw">
  <div class="lb">純資産（今日）</div>
  <div class="v">¥1,650,640</div>
  <svg width="700" height="170" viewBox="0 0 700 170"><polyline points="10,150 140,150 280,150 420,40 560,30 690,32" fill="none" stroke="#0f7a6c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#0f7a6c"><circle cx="10" cy="150" r="13"/><circle cx="140" cy="150" r="13"/><circle cx="280" cy="150" r="13"/><circle cx="420" cy="40" r="13"/><circle cx="560" cy="30" r="13"/><circle cx="690" cy="32" r="13"/></g></svg>
</div>

<!-- 境目のまわりを舞うタグ（文字は境目 x=1320 にかけない） -->
<div class="tag" style="left:930px;top:2330px;transform:rotate(-8deg)"><i style="background:#2f9e8d"></i>生活費</div>
<div class="tag" style="left:1420px;top:1440px;transform:rotate(6deg)"><i style="background:#3f7cad"></i>旅行</div>
<div class="tag" style="left:1470px;top:2480px;transform:rotate(-4deg)"><i style="background:#d98324"></i>積立</div>

<!-- 行き先: 口座の中の目的別の残高（仮の値。デモ帳簿に配分を入れて実際の画面の値に差し替える） -->
<div class="card alloc">
  <div class="lb">普通預金 ¥1,106,430</div>
  <div class="bar"><div style="flex:30;background:#2f9e8d"></div><div style="flex:20;background:#3f7cad"></div><div style="flex:40;background:#d98324"></div><div style="flex:10.6;background:#d5dbd9"></div></div>
  <div class="row"><i style="background:#2f9e8d"></i><span>生活費</span><b>¥300,000</b></div>
  <div class="row"><i style="background:#3f7cad"></i><span>旅行</span><b>¥200,000</b></div>
  <div class="row"><i style="background:#d98324"></i><span>積立</span><b>¥400,000</b></div>
  <div class="row" style="color:#5c656d"><i style="background:#d5dbd9"></i><span>未配分</span><b>¥206,430</b></div>
</div>
</body></html>
